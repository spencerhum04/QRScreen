<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRScreen</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>QRScreen</h1>
      <p class="subtitle">Find every QR code in an image or screenshot.</p>
    </header>

    <section id="dropzone" class="dropzone" tabindex="0">
      <p><strong>Drop an image here</strong>, paste one (⌘V / Ctrl+V), or</p>
      <label class="button">
        Choose image
        <input id="file-input" type="file" accept="image/*" hidden>
      </label>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="preview" class="preview" hidden>
      <div id="stage" class="stage">
        <img id="image" alt="Selected image">
        <svg id="outlines" class="outlines" aria-hidden="true"></svg>
        <div id="labels" class="labels"></div>
      </div>
    </section>

    <ol id="results" class="results"></ol>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
